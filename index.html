<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitive Market Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="role-overlay" class="overlay">
        <div class="card">
            <h1>Choose Your Role</h1>
            <p>Market for Oranges</p>
            <div class="role-buttons">
                <button class="btn-role" onclick="startGame('BUYER')">
                    <div class="icon">🛒</div>
                    <h3>BUYER</h3>
                    <p>Goal: Buy Low</p>
                </button>
                <button class="btn-role" onclick="startGame('SELLER')">
                    <div class="icon">🍊</div>
                    <h3>SELLER</h3>
                    <p>Goal: Sell High</p>
                </button>
            </div>
        </div>
    </div>

    <div class="game-container" id="game-interface" style="display:none;">
        
        <div class="instructions-panel">
            <h3>📝 How to Play</h3>
            <p id="instruction-text">Loading instructions...</p>
        </div>

        <div class="header">
            <div class="stats">
                <h2 id="user-role-display">LOADING...</h2>
                <p><span id="label-unit-val">Unit Value</span>: <span id="unit-val">$0.00</span></p>
                <p>Inventory: <span id="inventory">0</span> / 3</p>
                <p>Total Earnings: <span id="earnings">$0.00</span></p>
            </div>
            
            <div class="ticker-area">
                <h4>Recent Transactions</h4>
                <div id="transaction-log">
                    <div class="log-entry header-row">
                        <span>Price</span><span>ByType</span>
                    </div>
                    </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="controls">
                <img src="https://emojigraph.org/media/apple/orange_1f34a.png" alt="Orange" class="orange-img">
                
                <div class="profit-display">
                    Potential Profit: <span id="potential-profit">--</span>
                </div>
                
                <div class="slider-container">
                    <input type="range" id="price-slider" min="0.00" max="3.00" step="0.01" value="1.50">
                    <div class="slider-val">
                        <span id="action-label">Your Bid</span>: $<span id="slider-display">1.50</span>
                    </div>
                </div>

                <div class="buttons">
                    <button id="btn-primary" class="btn-orange">SUBMIT ORDER</button>
                </div>
                
                <div class="or-divider">- OR -</div>

                <div class="quick-action">
                    <button id="btn-quick" class="btn-blue">Accept Best Market Price</button>
                </div>
            </div>

            <div class="order-book">
                <div class="col">
                    <h3>BIDS (Buyers)</h3>
                    <div id="bids-list" class="list"></div>
                </div>
                <div class="col">
                    <h3>ASKS (Sellers)</h3>
                    <div id="asks-list" class="list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
